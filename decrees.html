<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اصلاح احکام پرسنلی | اداره کل سرمایه انسانی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root { --bg-gradient: linear-gradient(135deg, #e0f2f1 0%, #f1f8e9 100%); --gold: #d4a843; --primary: #0d8a63; --card-bg:#fff; --text:#1a2a4a; --muted:#666; --border:#ddd; }
body.dark { --bg-gradient: linear-gradient(135deg, #0a3b2a 0%, #1a4d3a 100%); --card-bg:#102b20; --text:#e8f5e9; --muted:#a5c9b8; --border:#2a4a3a; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; }
body { background: var(--bg-gradient); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: background 0.5s; color: var(--text); }
header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #1a2a4a 0%, #2a3f6b 100%); color: #fff; padding: 15px 25px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
header h1 { font-size: 1.2rem; color: var(--gold); }
.back-btn { background: rgba(255,255,255,0.2); color: #fff; padding: 8px 20px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; border: 1px solid rgba(255,255,255,0.4); cursor: pointer; }
.back-btn:hover { background: var(--gold); color: #1a2a4a; }

.floating-controls { position: fixed; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 150; }
.float-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #fff; color: #1a2a4a; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: 0.3s; }
.float-btn:hover { background: var(--gold); color: #fff; transform: scale(1.1); }

.main-card { width: 100%; max-width: 820px; background: var(--card-bg); border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border: 2px solid var(--gold); position: relative; overflow: hidden; }

#step1 { text-align: center; }
#step1 h2 { color: var(--text); margin-bottom: 15px; }
#step1 input { padding: 12px; border-radius: 10px; border: 2px solid var(--border); font-family: inherit; font-size: 1rem; width: 240px; text-align: center; margin-bottom: 15px; outline: none; background: var(--card-bg); color: var(--text); }
#step1 button { padding: 12px 30px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
#step1 button:hover { background: var(--gold); }

#step2 { display: none; }
.chat-log { background: rgba(13,138,99,0.08); border-radius: 15px; padding: 15px; max-height: 360px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(13,138,99,0.2); }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; line-height: 1.6; font-size: 0.9rem; }
.msg.bot { background: #fff8e1; border: 1px solid var(--gold); align-self: flex-start; color: #1a2a4a; }
body.dark .msg.bot { background: #3a2e1a; color: #f1e6c8; }
.msg.user { background: var(--primary); color: #fff; align-self: flex-end; }

.options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.opt-btn { padding: 9px 18px; border-radius: 12px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; transition: 0.25s; font-family: inherit; font-size: 0.85rem; }
.opt-btn:hover { background: var(--primary); color: #fff; }
.opt-btn.selected { background: var(--primary); color: #fff; }

.input-line { display: flex; gap: 8px; margin-bottom: 12px; }
.input-line input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--border); font-family: inherit; background: var(--card-bg); color: var(--text); outline: none; font-size: 0.9rem; }
.input-line button { padding: 10px 22px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; font-family: inherit; transition: 0.25s; }
.input-line button:hover { background: var(--gold); }

.draft-box { background: #fffdf5; border: 2px dashed var(--gold); border-radius: 15px; padding: 18px; margin-bottom: 15px; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.9; color: var(--text); display: none; }
body.dark .draft-box { background: #2a2415; }

.confirm-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, #0d8a63, #1f9e73); color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; display: none; }
.confirm-btn:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(13,138,99,0.4); }

#trackingCode { display: none; text-align: center; padding: 20px; background: #e8f5e9; border-radius: 15px; margin-top: 20px; border: 2px solid var(--primary); }
body.dark #trackingCode { background: #16382a; }
#trackingCode h3 { color: var(--primary); margin-bottom: 10px; }
#trackingCode span { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; color: var(--text); }

.track-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.track-actions button { padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: inherit; }
.btn-copy { background: #0d8a63; color: #fff; }
.btn-save { background: #d4a843; color: #1a2a4a; }

#satisfactionToggle { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #1a2a4a 0%, #2a3f6b 100%); color: #fff; padding: 8px 25px; border-radius: 15px 15px 0 0; cursor: pointer; z-index: 9999; font-weight: bold; font-size: 0.85rem; border: 1px solid var(--gold); border-bottom: none; }
#satisfactionBox { position: fixed; bottom: -220px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: var(--card-bg); padding: 15px; border-radius: 15px 15px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.3); z-index: 9998; text-align: center; border: 2px solid var(--gold); border-bottom: none; transition: bottom 0.4s ease; }
</style>
<script src="assets/js/i18n.js"></script>
</head>
<body>

<header>
  <h1 data-fa="📜 اصلاح و بازنویسی احکام" data-en="📜 Decree Revision & Rewriting">📜 اصلاح و بازنویسی احکام</h1>
  <a href="index.html" class="back-btn" data-fa="بازگشت به سایت" data-en="Back to site">بازگشت به سایت</a>
</header>

<div class="floating-controls">
  <button class="float-btn" onclick="toggleTheme()" title="تم روز/شب">🌓</button>
  <button class="float-btn" onclick="toggleLang()" title="تغییر زبان">🌐</button>
</div>

<div class="main-card">
  <!-- مرحله ۱: ورود کد اصلاح حکم -->
  <div id="step1">
    <h2 data-fa="🌟 ورود به بخش اصلاح حکم" data-en="🌟 Enter Decree Revision">🌟 ورود به بخش اصلاح حکم</h2>
    <p style="margin-bottom: 20px; color: var(--muted);" data-fa="لطفاً کد اصلاحی که ادمین برای شما صادر کرده است را وارد کنید." data-en="Please enter the revision code issued by admin.">لطفاً کد اصلاحی که ادمین برای شما صادر کرده است را وارد کنید.</p>
    <input type="text" id="decreeCode" placeholder="DEC-XXXX" data-fa-placeholder="DEC-XXXX" data-en-placeholder="DEC-XXXX">
    <br>
    <button onclick="checkDecreeCode()" data-fa="ورود" data-en="Enter">ورود</button>
  </div>

  <!-- مرحله ۲: چت‌بات شماتیک -->
  <div id="step2">
    <h2 style="margin-bottom: 12px; color: var(--primary);" data-fa="🤖 دستیار هوشمند اصلاح حکم" data-en="🤖 Smart Decree Revision Assistant">🤖 دستیار هوشمند اصلاح حکم</h2>
    <div class="chat-log" id="chatLog"></div>
    <div id="optionsArea" class="options"></div>
    <div id="inputArea" class="input-line" style="display:none;">
      <input type="text" id="freeInput" data-fa-placeholder="پاسخ خود را بنویسید..." data-en-placeholder="Type your answer...">
      <button onclick="submitFreeInput()" data-fa="ارسال" data-en="Send">ارسال</button>
    </div>
    <div class="draft-box" id="draftBox"></div>
    <button class="confirm-btn" id="confirmBtn" onclick="confirmAndSend()" data-fa="✅ تایید و ارسال برای ادمین" data-en="✅ Confirm & Send to Admin">✅ تایید و ارسال برای ادمین</button>
    <div id="trackingCode">
      <h3 data-fa="✅ حکم شما برای ادمین ارسال شد." data-en="✅ Your decree was sent to admin.">✅ حکم شما برای ادمین ارسال شد.</h3>
      <p data-fa="کد رهگیری شما:" data-en="Your tracking code:">کد رهگیری شما:</p>
      <span id="trackCodeDisplay">---</span>
      <div class="track-actions">
        <button class="btn-copy" onclick="copyTrackingCode()" data-fa="📋 کپی کد رهگیری" data-en="📋 Copy tracking code">📋 کپی کد رهگیری</button>
        <button class="btn-save" onclick="downloadTrackingCode()" data-fa="💾 ذخیره در گوشی/کامپیوتر" data-en="💾 Save to device">💾 ذخیره در گوشی/کامپیوتر</button>
      </div>
    </div>
  </div>
</div>

<!-- نظرسنجی -->
<div id="satisfactionToggle" onclick="toggleSatisfaction()" data-fa="⭐ ثبت رضایتمندی" data-en="⭐ Rate us">⭐ ثبت رضایتمندی</div>
<div id="satisfactionBox">
  <p style="margin-bottom: 10px; font-weight: bold; color: var(--text);" data-fa="میزان رضایت شما از این صفحه چقدر است؟" data-en="How satisfied are you with this page?">میزان رضایت شما از این صفحه چقدر است؟</p>
  <div style="display: flex; gap: 10px; justify-content: center;">
    <button onclick="submitSatisfaction(0)" style="width:45px;height:45px;border-radius:50%;border:none;background:#ff4757;color:#fff;cursor:pointer;font-weight:bold;">۰</button>
    <button onclick="submitSatisfaction(1)" style="width:45px;height:45px;border-radius:50%;border:none;background:#ff6b81;color:#fff;cursor:pointer;font-weight:bold;">۱</button>
    <button onclick="submitSatisfaction(2)" style="width:45px;height:45px;border-radius:50%;border:none;background:#ffa502;color:#fff;cursor:pointer;font-weight:bold;">۲</button>
    <button onclick="submitSatisfaction(3)" style="width:45px;height:45px;border-radius:50%;border:none;background:#eccc68;color:#1a2a4a;cursor:pointer;font-weight:bold;">۳</button>
    <button onclick="submitSatisfaction(4)" style="width:45px;height:45px;border-radius:50%;border:none;background:#7bed9f;color:#1a2a4a;cursor:pointer;font-weight:bold;">۴</button>
    <button onclick="submitSatisfaction(5)" style="width:45px;height:45px;border-radius:50%;border:none;background:#2ed573;color:#fff;cursor:pointer;font-weight:bold;">۵</button>
  </div>
</div>

<script>
const LS = {
  CONSULTANTS: 'hr_consultants',
  TASKS: 'hr_tasks',
  REPORTS: 'hr_reports',
  BRAIN_TOPICS: 'hr_brainstorm_topics',
  BRAIN_IDEAS: 'hr_brainstorm_ideas',
  BRAIN_REPORTS: 'hr_brainstorm_reports',
  PERSONNEL: 'hr_personnel',
  SURVEYS: 'hr_surveys',
  SETTINGS: 'hr_settings',
  DECREE_EDITORS: 'hr_decree_editors',
  PENDING_DECREES: 'hr_pending_decrees'
};

/* ===== Helpers ===== */
function getLS(key, fallback = []) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
function setLS(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ===== Theme / Lang ===== */
function toggleTheme() { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); }
let currentLang = localStorage.getItem('lang') || 'fa';
function applyLang() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-fa]').forEach(el => { el.textContent = currentLang === 'fa' ? el.dataset.fa : el.dataset.en; });
  document.querySelectorAll('[data-fa-placeholder]').forEach(el => { el.placeholder = currentLang === 'fa' ? el.dataset.faPlaceholder : el.dataset.enPlaceholder; });
  renderOptions();
}
function toggleLang() { currentLang = currentLang === 'fa' ? 'en' : 'fa'; localStorage.setItem('lang', currentLang); applyLang(); }

/* ===== Survey ===== */
function toggleSatisfaction() { const b = document.getElementById('satisfactionBox'); b.style.bottom = b.style.bottom === '0px' ? '-220px' : '0px'; }
function submitSatisfaction(s) { localStorage.setItem('decree_satisfaction', s); alert((currentLang==='fa'?'امتیاز ':'Score ')+s+(currentLang==='fa'?' ثبت شد. با تشکر!':' recorded. Thanks!')); document.getElementById('satisfactionBox').style.bottom = '-220px'; }

/* ===== Flow state ===== */
let currentEditor = null;
let stepIndex = 0;
let answers = {};
let steps = [];

function buildSteps() {
  steps = [
    {
      key: 'goal',
      qFa: '🎯 هدف از اصلاح حکم چیست؟',
      qEn: '🎯 What is the goal of the decree revision?',
      type: 'options',
      options: [
        { fa: 'تغییر پست', en: 'Change position' },
        { fa: 'تغییر حقوق', en: 'Change salary' },
        { fa: 'بازنویسی کل', en: 'Full rewrite' },
        { fa: 'اجرای حکم', en: 'Execute decree' },
        { fa: 'ابلاغ', en: 'Notify' }
      ]
    },
    {
      key: 'section',
      qFa: '📌 کدام بخش حکم باید تغییر کند؟',
      qEn: '📌 Which part of the decree should change?',
      type: 'free',
      placeholderFa: 'مثلاً: بخش حقوق و مزایا',
      placeholderEn: 'e.g. Salary & benefits section'
    },
    {
      key: 'reason',
      qFa: '📝 دلیل تغییر چیست؟',
      qEn: '📝 What is the reason for the change?',
      type: 'free',
      placeholderFa: 'دلیل تغییر را بنویسید...',
      placeholderEn: 'Write the reason...'
    },
    {
      key: 'approval',
      qFa: '✅ آیا نیاز به تایید مافوق دارد؟',
      qEn: '✅ Does it need supervisor approval?',
      type: 'options',
      options: [ { fa: 'بله', en: 'Yes' }, { fa: 'خیر', en: 'No' } ]
    }
  ];
}

function renderOptions() {
  const area = document.getElementById('optionsArea');
  const inputArea = document.getElementById('inputArea');
  if (!area) return;
  area.innerHTML = '';
  inputArea.style.display = 'none';
  if (stepIndex >= steps.length) return;
  const step = steps[stepIndex];
  if (step.type === 'options') {
    step.options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = currentLang === 'fa' ? opt.fa : opt.en;
      b.onclick = () => selectOption(opt);
      area.appendChild(b);
    });
  } else {
    inputArea.style.display = 'flex';
    document.getElementById('freeInput').placeholder = currentLang === 'fa' ? step.placeholderFa : step.placeholderEn;
    document.getElementById('freeInput').value = '';
    document.getElementById('freeInput').focus();
  }
}

function addMsg(text, sender) {
  const log = document.getElementById('chatLog');
  const d = document.createElement('div');
  d.className = 'msg ' + sender;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function askCurrentStep() {
  if (stepIndex >= steps.length) { finishChat(); return; }
  const s = steps[stepIndex];
  addMsg(currentLang === 'fa' ? s.qFa : s.qEn, 'bot');
  renderOptions();
}

function selectOption(opt) {
  const label = currentLang === 'fa' ? opt.fa : opt.en;
  addMsg(label, 'user');
  answers[steps[stepIndex].key] = label;
  stepIndex++;
  setTimeout(askCurrentStep, 350);
}

function submitFreeInput() {
  const val = document.getElementById('freeInput').value.trim();
  if (!val) return;
  addMsg(val, 'user');
  answers[steps[stepIndex].key] = val;
  stepIndex++;
  setTimeout(askCurrentStep, 350);
}

function finishChat() {
  document.getElementById('optionsArea').innerHTML = '';
  document.getElementById('inputArea').style.display = 'none';
  const draft = buildDraft();
  const box = document.getElementById('draftBox');
  box.style.display = 'block';
  box.textContent = draft;
  document.getElementById('confirmBtn').style.display = 'block';
  addMsg(currentLang === 'fa' ? '✅ نمونه حکم آماده شد. لطفاً بررسی و تایید کنید.' : '✅ Draft is ready. Please review and confirm.', 'bot');
}

function buildDraft() {
  if (currentLang === 'fa') {
    return `📜 نمونه حکم اصلاحی
———————————————
نام: ${currentEditor.name}
کد پرسنلی: ${currentEditor.personnelCode}

هدف از اصلاح: ${answers.goal || '-'}
بخش مورد تغییر: ${answers.section || '-'}
دلیل تغییر: ${answers.reason || '-'}
نیاز به تایید مافوق: ${answers.approval || '-'}

این حکم به منظور ${answers.goal || 'اصلاح'} در بخش «${answers.section || '-'}» و با دلیل «${answers.reason || '-'}» تنظیم شده است. ${answers.approval === 'بله' ? 'اجرای آن منوط به تایید مافوق می‌باشد.' : 'اجرای آن بدون نیاز به تایید مافوق امکان‌پذیر است.'}`;
  }
  return `📜 Draft Revised Decree
———————————————
Name: ${currentEditor.name}
Personnel Code: ${currentEditor.personnelCode}

Goal: ${answers.goal || '-'}
Section to change: ${answers.section || '-'}
Reason: ${answers.reason || '-'}
Needs supervisor approval: ${answers.approval || '-'}

This decree is issued for "${answers.goal || 'revision'}" in section "${answers.section || '-'}" due to "${answers.reason || '-'}". ${answers.approval === 'Yes' ? 'Execution requires supervisor approval.' : 'Execution does not require supervisor approval.'}`;
}

function confirmAndSend() {
  const draftText = document.getElementById('draftBox').textContent;
  const trackingCode = 'DECR-' + Math.floor(Math.random() * 90000 + 10000);
  const pending = getLS(LS.PENDING_DECREES);
  pending.push({
    id: uid(),
    trackingCode,
    editorCode: currentEditor.code,
    editorName: currentEditor.name,
    personnelCode: currentEditor.personnelCode,
    goal: answers.goal || '',
    section: answers.section || '',
    reason: answers.reason || '',
    needsApproval: answers.approval || '',
    draftText,
    createdAt: Date.now(),
    status: 'pending'
  });
  setLS(LS.PENDING_DECREES, pending);
  document.getElementById('trackCodeDisplay').innerText = trackingCode;
  document.getElementById('trackingCode').style.display = 'block';
  document.getElementById('confirmBtn').style.display = 'none';
  document.getElementById('draftBox').style.display = 'none';
  alert(currentLang === 'fa' ? 'حکم برای ادمین ارسال شد. کد رهگیری: ' + trackingCode : 'Sent to admin. Tracking code: ' + trackingCode);
}

function copyTrackingCode() {
  const code = document.getElementById('trackCodeDisplay').innerText;
  navigator.clipboard.writeText(code).then(() => alert((currentLang==='fa'?'کد رهگیری کپی شد: ':'Tracking code copied: ') + code))
    .catch(() => alert((currentLang==='fa'?'کپی نشد. دستی یادداشت کنید: ':'Copy failed. Note it: ') + code));
}

function downloadTrackingCode() {
  const code = document.getElementById('trackCodeDisplay').innerText;
  const text = (currentLang==='fa'?'کد رهگیری حکم اصلاحی:\n':'Decree tracking code:\n') + code + '\n\n' + new Date().toLocaleString(currentLang==='fa'?'fa-IR':'en-US');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'decree-tracking-' + code + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
}

/* ===== Step 1: check code ===== */
function checkDecreeCode() {
  const code = document.getElementById('decreeCode').value.trim().toUpperCase();
  const editors = getLS(LS.DECREE_EDITORS);
  const found = editors.find(e => e.code === code && e.active !== false);
  if (!found) {
    alert(currentLang === 'fa' ? 'کد اصلاح حکم معتبر نیست یا غیرفعال شده است.' : 'Invalid or inactive revision code.');
    return;
  }
  currentEditor = found;
  stepIndex = 0;
  answers = {};
  buildSteps();
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  addMsg(currentLang === 'fa' ? `سلام ${found.name} عزیز! من دستیار اصلاح حکم هستم. چند سوال از شما می‌پرسم تا نمونه حکم آماده شود.` : `Hello ${found.name}! I'm the decree revision assistant. I'll ask a few questions to prepare a draft.`, 'bot');
  setTimeout(askCurrentStep, 500);
}

/* ===== init ===== */
window.addEventListener('load', () => {
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
  applyLang();
  if (!localStorage.getItem(LS.DECREE_EDITORS)) setLS(LS.DECREE_EDITORS, []);
  if (!localStorage.getItem(LS.PENDING_DECREES)) setLS(LS.PENDING_DECREES, []);
});
document.getElementById('freeInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') submitFreeInput(); });
</script>
</body>
</html>
